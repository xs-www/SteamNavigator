# @static-doc
# 作用：官网 Docker Compose：低内存静态站容器 + 游玩数据接收端容器 + 可选 Cloudflare Tunnel 容器。
#
# ## 契约与约束
# - 契约：`docs/design/TELEMETRY.md` §4；`website` 通过 nginx 把 `/api/telemetry/` 反代到 `http://telemetry:8090`。
# - 默认只把宿主机 8088 绑定到 127.0.0.1（容器内 8080），公网入口由 Cloudflare Tunnel 提供；
#   `telemetry` 不映射宿主机端口，只能从 `website` 容器访问。
# - 两个容器都只读、丢弃 capabilities、限制 CPU / 内存 / pids；运行期分别只写 `/tmp` 与 `/data`。
# - `telemetry` 数据卷 `telemetry-data` 挂到 `/data`（会话 JSON 与 index.ndjson），备份与保留期见 `website/README.md`。
# - `website` 在 `telemetry` healthcheck 通过后才启动，避免反代目标长期 502。
# - `cloudflared` 使用 profile `tunnel`，未启用时不启动；origin 地址使用 Compose 服务名 `http://website:8080`。
#
# ## 重点逻辑
# ### 资源
# - `website`：32 MB / 0.25 CPU；`telemetry`：64 MB / 0.5 CPU（Node 运行时 + 每小时清理扫描）。
# ### Cloudflare
# - 用 Zero Trust Tunnel 的 token 运行 cloudflared；域名与 Public Hostname 在 Cloudflare 控制台配置。
# - 若 cloudflared 跑在宿主机而不是容器里，把 origin 指向 `http://127.0.0.1:8088` 即可。
# ### 令牌
# - `.env` 的 `SN_TELEMETRY_TOKEN` 非空时，接收端要求 `X-SN-Telemetry-Token`；必须与游戏发布配置一致。
# @end-static-doc

name: steam-navigator-website

services:
  website:
    image: ${WEBSITE_IMAGE:-steam-navigator-website:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: steam-navigator-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-8088}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    mem_limit: 32m
    mem_reservation: 8m
    cpus: "0.25"
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      telemetry:
        condition: service_healthy
      site-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  telemetry:
    image: ${TELEMETRY_IMAGE:-steam-navigator-telemetry:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.telemetry
    container_name: steam-navigator-telemetry
    restart: unless-stopped
    environment:
      SN_TELEMETRY_PORT: "8090"
      SN_TELEMETRY_DATA_DIR: /data
      SN_TELEMETRY_TOKEN: ${SN_TELEMETRY_TOKEN:-}
    volumes:
      - telemetry-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    mem_limit: 64m
    mem_reservation: 16m
    cpus: "0.5"
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:8090/api/telemetry/health',(res)=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 官网只读内容 API：服务端缓存 GitHub Releases，发版后网站无需重新部署即可显示最新版本。
  # 不映射宿主机端口，只由 website 的 nginx `/api/site/` 反代。
  site-api:
    image: ${SITE_API_IMAGE:-steam-navigator-site-api:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.site-api
    container_name: steam-navigator-site-api
    restart: unless-stopped
    environment:
      SN_SITE_API_PORT: "8092"
      SN_SITE_API_CACHE_SECONDS: ${SN_SITE_API_CACHE_SECONDS:-300}
      GITHUB_TOKEN: ${SN_SITE_GITHUB_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    mem_limit: 48m
    mem_reservation: 12m
    cpus: "0.2"
    pids_limit: 32
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:8092/api/site/health',(res)=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 本地「游玩数据看板」：只读挂载同一个遥测数据卷，默认只发布到宿主机 127.0.0.1:8091。
  # 只在需要查看数据时启动：`docker compose --profile dashboard up -d`。
  telemetry-dashboard:
    image: ${TELEMETRY_DASHBOARD_IMAGE:-steam-navigator-telemetry-dashboard:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
    container_name: steam-navigator-telemetry-dashboard
    profiles: ["dashboard"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TELEMETRY_DASHBOARD_PORT:-8091}:8091"
    volumes:
      - telemetry-data:/data:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    mem_limit: 32m
    mem_reservation: 8m
    cpus: "0.1"
    pids_limit: 32
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:8091/api/health',(res)=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    container_name: steam-navigator-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      website:
        condition: service_healthy
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  telemetry-data:
