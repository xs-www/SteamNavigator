# @static-doc
# 作用：官网镜像内的 nginx 配置：单 worker、8080 端口、gzip、静态缓存、健康检查、基础安全响应头，以及 /api/telemetry/ 反代。
#
# ## 契约与约束
# - 与 `deploy/Dockerfile` 配套：nginx 以非 root 运行，pid 和临时文件写入 `/tmp`，日志写 stdout/stderr。
# - 不使用 `add_header` 覆盖 server 级安全头；缓存用 `expires` 指令，避免 location 丢失继承。
# - HTML 与版本数据（`assets/data/release-data.js`）不缓存，其余 `assets/` 缓存 7 天；发布新版本后由浏览器重新校验入口页。
# - `/api/telemetry/` 反代到 Compose 服务 `telemetry:8090`；`/api/site/` 反代到 `site-api:8092`
#   （官网只读内容 API，服务端缓存 GitHub Releases）；`/downloads/` 直接读 `release-downloads` 只读卷
#   （最新 Windows 安装包，Range + 30 天缓存）；其余请求只服务静态文件。
# - 接收端 location 关闭 access_log：nginx 默认访问日志会写客户端 IP，与 `docs/design/TELEMETRY.md` 的隐私红线冲突。
#
# ## 重点逻辑
# ### 低内存
# - `worker_processes 1`、`worker_connections 512`，足够支撑静态站。
# ### 健康检查
# - `/healthz` 直接返回 `ok`，不写访问日志。
# ### 游玩数据反代
# - 用 `resolver` + 变量形式的 `proxy_pass` 在请求时解析服务名：`telemetry` 未启动或重建时 nginx 仍能启动，
#   只让该 location 返回 502，不影响静态站；`proxy_pass` 不带 URI，原样转发 `/api/telemetry/<path>`。
# - 只放行 GET / POST，请求体上限 1 MB，超时按客户端 8 秒上传预算收紧。
# @end-static-doc

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 2048;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 1m;

    client_body_temp_path /tmp;
    proxy_temp_path /tmp;
    fastcgi_temp_path /tmp;
    uwsgi_temp_path /tmp;
    scgi_temp_path /tmp;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 版本数据每次 Release 都会变：禁止浏览器 / CDN 长期缓存，否则部署后仍显示旧版本。
        # 其余 assets/ 仍保持 7 天缓存；本 location 不写 add_header，避免覆盖 server 级安全头。
        location = /assets/data/release-data.js {
            try_files $uri =404;
            expires -1;
            access_log off;
        }

        # 最新 Windows 安装包镜像（由 site-api 下载到卷里，nginx 只读下发；tag 目录不可变，长缓存）。
        location /downloads/ {
            try_files $uri =404;
            expires 30d;
            access_log off;
        }

        location /assets/ {
            try_files $uri =404;
            expires 7d;
            access_log off;
        }

        # 官网只读内容 API：服务端缓存 GitHub Releases，发版后无需重新部署即可显示最新版本。
        # 用变量 + resolver 延迟解析，site-api 未就绪时只让该 location 502，不影响静态站。
        location /api/site/ {
            access_log off;

            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }

            resolver 127.0.0.11 ipv6=off valid=10s;
            set $site_api_upstream http://site-api:8092;
            proxy_pass $site_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_buffering off;
        }

        # 游玩数据接收端：反代到 telemetry 容器（保留 /api/telemetry/ 前缀）。
        # 用变量 + resolver 延迟到请求时解析服务名，telemetry 未就绪不会导致 nginx 启动失败。
        location /api/telemetry/ {
            access_log off;
            client_max_body_size 1m;

            if ($request_method !~ ^(GET|POST)$) {
                return 405;
            }

            resolver 127.0.0.11 ipv6=off valid=10s;
            set $telemetry_upstream http://telemetry:8090;
            proxy_pass $telemetry_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ =404;
            expires -1;
        }
    }
}
