# @static-doc
# 作用：官网镜像内的 nginx 配置：单 worker、8080 端口、gzip、静态缓存、健康检查与基础安全响应头。
#
# ## 契约与约束
# - 与 `deploy/Dockerfile` 配套：nginx 以非 root 运行，pid 和临时文件写入 `/tmp`，日志写 stdout/stderr。
# - 不使用 `add_header` 覆盖 server 级安全头；缓存用 `expires` 指令，避免 location 丢失继承。
# - HTML 不缓存，`assets/` 缓存 7 天；发布新版本后由浏览器重新校验入口页。
# - 只服务静态文件，不做反向代理、不执行脚本、不开放目录列表。
#
# ## 重点逻辑
# ### 低内存
# - `worker_processes 1`、`worker_connections 512`，足够支撑静态站。
# ### 健康检查
# - `/healthz` 直接返回 `ok`，不写访问日志。
# @end-static-doc

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 2048;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 1m;

    client_body_temp_path /tmp;
    proxy_temp_path /tmp;
    fastcgi_temp_path /tmp;
    uwsgi_temp_path /tmp;
    scgi_temp_path /tmp;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            try_files $uri =404;
            expires 7d;
            access_log off;
        }

        location / {
            try_files $uri $uri/ =404;
            expires -1;
        }
    }
}
