<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- glass body fill -->
    <circle cx="64" cy="78" r="30" fill="#A9B6C2"/>
    <!-- amber contents -->
    <path d="M36 76 Q36 104 64 106 Q92 104 92 76 Z" fill="#B0782E" fill-opacity="0.92"/>
    <path d="M38 76 Q64 84 90 76" fill="none" stroke="#EBC978" stroke-width="2.6"/>
    <!-- glass outline -->
    <circle cx="64" cy="78" r="30" fill="none" stroke="#191713" stroke-width="6"/>
    <circle cx="64" cy="78" r="30" fill="none" stroke="#C9963C" stroke-width="3"/>
    <!-- neck -->
    <rect x="56" y="34" width="16" height="26" fill="#A9B6C2" stroke="#191713" stroke-width="5"/>
    <rect x="56" y="34" width="16" height="26" fill="none" stroke="#C9963C" stroke-width="3"/>
    <!-- brass collar -->
    <rect x="51" y="52" width="26" height="8" rx="2" fill="#C9963C" stroke="#191713" stroke-width="4"/>
    <!-- brass mouth -->
    <rect x="50" y="28" width="28" height="9" rx="3" fill="#B9862F" stroke="#191713" stroke-width="4"/>
    <!-- stopper -->
    <rect x="52" y="20" width="24" height="9" rx="4" fill="#8A6424" stroke="#191713" stroke-width="4"/>
    <path d="M56 23 L64 23" fill="none" stroke="#F0D9A0" stroke-width="2.6"/>
    <!-- highlights -->
    <path d="M44 62 A24 24 0 0 1 58 49" fill="none" stroke="#E7EDF3" stroke-width="4" opacity="0.9"/>
    <path d="M54 34 L54 46" fill="none" stroke="#E7EDF3" stroke-width="2.4" opacity="0.8"/>
    <ellipse cx="82" cy="92" rx="3" ry="6" fill="#E7EDF3" opacity="0.45" transform="rotate(24 82 92)"/>
  </g>
</svg>
