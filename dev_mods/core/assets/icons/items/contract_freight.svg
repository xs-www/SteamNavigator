<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- crate body -->
    <rect x="20" y="46" width="84" height="64" rx="4" fill="#6B7480" stroke="#191713" stroke-width="6"/>
    <rect x="20" y="46" width="84" height="64" rx="4" fill="none" stroke="#C9963C" stroke-width="3"/>
    <!-- lid -->
    <rect x="16" y="32" width="92" height="16" rx="4" fill="#7C8794" stroke="#191713" stroke-width="6"/>
    <rect x="16" y="32" width="92" height="16" rx="4" fill="none" stroke="#C9963C" stroke-width="3"/>
    <!-- plank seams -->
    <path d="M40 52 L40 106" fill="none" stroke="#191713" stroke-width="2.8" opacity="0.75"/>
    <path d="M64 52 L64 106" fill="none" stroke="#191713" stroke-width="2.8" opacity="0.75"/>
    <path d="M88 52 L88 106" fill="none" stroke="#191713" stroke-width="2.8" opacity="0.75"/>
    <!-- brass bands -->
    <rect x="20" y="54" width="84" height="7" fill="#B9862F" stroke="#191713" stroke-width="3"/>
    <rect x="20" y="94" width="84" height="7" fill="#B9862F" stroke="#191713" stroke-width="3"/>
    <!-- corner brackets -->
    <rect x="22" y="38" width="9" height="9" fill="#C9963C" stroke="#191713" stroke-width="3"/>
    <rect x="93" y="38" width="9" height="9" fill="#C9963C" stroke="#191713" stroke-width="3"/>
    <rect x="22" y="100" width="9" height="9" fill="#C9963C" stroke="#191713" stroke-width="3"/>
    <rect x="93" y="100" width="9" height="9" fill="#C9963C" stroke="#191713" stroke-width="3"/>
    <!-- freight seal -->
    <path d="M58 88 L70 88 L64 103 Z" fill="#B9862F" stroke="#191713" stroke-width="3"/>
    <circle cx="64" cy="77" r="17" fill="#C9963C" stroke="#191713" stroke-width="5"/>
    <circle cx="64" cy="77" r="10" fill="none" stroke="#8A6424" stroke-width="3"/>
    <circle cx="64" cy="77" r="4" fill="#8A6424"/>
    <path d="M55 69 A12 12 0 0 1 63 62" fill="none" stroke="#F0D9A0" stroke-width="3"/>
    <!-- highlights -->
    <path d="M24 40 L44 40" fill="none" stroke="#E7EDF3" stroke-width="3" opacity="0.65"/>
    <path d="M24 66 L24 86" fill="none" stroke="#DCE3EA" stroke-width="2.6" opacity="0.5"/>
  </g>
</svg>
