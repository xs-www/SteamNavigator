<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Steam Navigator 零依赖网页端模组制作器：可视化编辑 Manifest、内容、本地化与资源，并打包为 .snavmod.zip。">
  <title>Steam Navigator · 模组制作器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%230d1418' stroke='%23d9a441' stroke-width='3'/%3E%3Cpath d='M32 14l5 13-5-4-5 4z' fill='%23d9a441'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23d9a441'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="brand" data-action="welcome" title="回到首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5" opacity=".7"/>
              <circle cx="24" cy="24" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M24 9l3.4 9.4L24 16l-3.4 2.4z" fill="currentColor"/>
              <path d="M24 39l-3.4-9.4L24 32l3.4-2.4z" fill="currentColor" opacity=".55"/>
              <circle cx="24" cy="24" r="2.6" fill="currentColor"/>
            </svg>
          </span>
          <span class="brand-text">
            <strong>STEAM NAVIGATOR</strong>
            <span>MOD MAKER · 零依赖</span>
          </span>
        </button>
      </div>
      <div class="topbar-project" id="project-chip"></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-status" id="topbar-status"></div>
      <nav class="topbar-actions" id="topbar-actions" aria-label="主要操作"></nav>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="内容导航"></aside>
      <main class="workspace" id="workspace" tabindex="-1"></main>
      <aside class="inspector" id="inspector" hidden aria-label="JSON 检视"></aside>
    </div>
  </div>

  <div class="datalist-host" id="datalists" aria-hidden="true"></div>

  <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
    <div class="drop-card">
      <span class="drop-icon">⇩</span>
      <strong>释放以导入模组</strong>
      <span>文件夹 / .snavmod.zip / .snmodproj.json</span>
    </div>
  </div>

  <div class="busy" id="busy" aria-hidden="true">
    <div class="spinner"></div>
    <p data-busy-text>处理中…</p>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <dialog class="modal" id="modal"></dialog>

  <noscript>
    <div class="noscript">模组制作器需要启用 JavaScript。</div>
  </noscript>

  <script src="js/schema-bundle.js"></script>
  <script src="js/core-index.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/store.js"></script>
  <script src="js/io.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
