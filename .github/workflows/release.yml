name: Dev Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor and templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-v1

      - name: Install Godot 4.7.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip libfontconfig1
          mkdir -p "$HOME/godot-bin"
          curl -fL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
          curl -fL --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Put Godot on PATH
        shell: bash
        run: |
          chmod +x "$HOME/godot-bin/godot"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://framework/tests/test_runner.gd

      - name: Check generated content types
        shell: bash
        run: |
          set -euo pipefail
          node tools/gen_content_types.mjs --check

      - name: Check static documentation
        shell: bash
        run: |
          set -euo pipefail
          node tools/gen_static_docs.mjs --check

      # Phase E: Content Schema 1.0 is frozen. Fail the release if any active/
      # draft type, Core/SDK content envelope, or FrameworkInfo baseline is not 2.0.
      - name: Check Content Schema 2.0 freeze
        shell: bash
        run: |
          set -euo pipefail
          node tools/check_content_schema_v2.mjs

      # The editor and Content CLI share the same validation engine as the game;
      # keep their suites in the release gate so content-type promotions cannot
      # silently drift from the deploy guard / capability semantics.
      - name: Run SNModMaker and Content CLI tests
        shell: bash
        run: |
          set -euo pipefail
          node SNModMaker/tests/run-tests.js
          node --test SNModMaker/tests/content-cli.test.mjs

      # The official-site ingest endpoint is a public HTTP surface; its
      # validation, storage and retention rules are release-gated like the other
      # Node tooling. The local dashboard shares the same on-disk format, and the
      # website version data is generated from this release's GitHub metadata.
      - name: Run website telemetry tests
        shell: bash
        run: |
          set -euo pipefail
          node --test website/tests/telemetry.test.mjs website/tests/telemetry-dashboard.test.mjs website/tests/release-data.test.mjs website/tests/site-api.test.mjs

      # Fails the release when the loose core mod is missing a declared
      # content file, localization file or asset (for example an untracked GLB),
      # and rejects any draft content the runtime does not load.
      - name: Validate core content (runtime)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://sdk/validate.gd -- --mode=runtime

      # SDK compatibility gate: all runtime examples are Content Schema 2.0 and
      # must load in the real runtime; draft-only types may be schema-checked with
      # --mode=draft but must never be treated as publishable.
      - name: Validate SDK examples (runtime + draft)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://sdk/validate.gd -- \
            --mod-root=sdk/examples/example_crew_roles --mode=runtime
          godot --headless --path . --script res://sdk/validate.gd -- \
            --mod-root=sdk/examples/example_mixed_crew_roles_items --mode=runtime
          godot --headless --path . --script res://sdk/validate.gd -- \
            --mod-root=sdk/examples/example_weapons --mode=runtime
          godot --headless --path . --script res://sdk/validate.gd -- \
            --mod-root=sdk/examples/example_fleet --mode=runtime
          godot --headless --path . --script res://sdk/validate.gd -- \
            --mod-root=sdk/examples/example_base --mode=runtime
          godot --headless --path . --script res://sdk/validate.gd -- \
            --mod-root=sdk/examples/example_trade --mode=runtime
          godot --headless --path . --script res://sdk/validate.gd -- \
            --mod-root=sdk/examples/example_ruins --mode=runtime
          godot --headless --path . --script res://sdk/validate.gd -- \
            --mod-root=sdk/templates/story_pack_iron_tide --mode=draft
          godot --headless --path . --script res://sdk/validate.gd -- \
            --mod-root=sdk/templates/draft_combat_ai_profile --mode=draft

      # Release packing must refuse content the runtime cannot activate; the
      # command is expected to fail (exit 1) and leave dist/mods untouched.
      - name: Release packing rejects draft content
        shell: bash
        run: |
          set -euo pipefail
          if godot --headless --path . --script res://sdk/pack_mod.gd -- \
              --source=sdk/templates/story_pack_iron_tide --out=dist/mods --release; then
            echo "draft content must not pass --release packing" >&2
            exit 1
          fi

      # The opt-in gameplay-log uploader posts to the official site. The endpoint
      # and optional shared token are deployment values, not repository content:
      # inject them before export so both the packaged default and the portable
      # config/config.json next to the executable carry the real target. Empty
      # repository values keep the committed defaults untouched.
      - name: Inject telemetry endpoint
        shell: bash
        env:
          SN_TELEMETRY_ENDPOINT: ${{ vars.SN_TELEMETRY_ENDPOINT }}
          SN_TELEMETRY_TOKEN: ${{ secrets.SN_TELEMETRY_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const path = "config/config.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            const endpoint = (process.env.SN_TELEMETRY_ENDPOINT || "").trim();
            const token = (process.env.SN_TELEMETRY_TOKEN || "").trim();
            if (endpoint) config.telemetry_endpoint = endpoint;
            if (token) config.telemetry_token = token;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
            console.log(`telemetry endpoint: ${config.telemetry_endpoint}`);
          '

      - name: Export Windows and Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/build/windows dist/build/linux dist/release
          godot --headless --path . --export-release "Windows Desktop" "dist/build/windows/SteamNavigator.exe"
          godot --headless --path . --export-release "Linux/X11" "dist/build/linux/SteamNavigator.x86_64"

      - name: Pack core mod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mods
          # --release validates the loose core through the real Bootstrap before
          # writing the pack, so a degraded core can never ship.
          godot --headless --path . --script res://sdk/pack_mod.gd -- \
            --source=dev_mods/core --out=dist/mods --release

      # Standard portable layout: the executable sits next to mods/ and config/.
      - name: Stage portable release layout
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packs=(dist/mods/*.snavmod.zip)
          if [ "${#packs[@]}" -ne 1 ]; then
            echo "expected exactly one core pack in dist/mods, found ${#packs[@]}" >&2
            exit 1
          fi
          CORE_PACK="${packs[0]}"
          for target in windows linux; do
            mkdir -p "dist/build/${target}/mods" "dist/build/${target}/config"
            cp "${CORE_PACK}" "dist/build/${target}/mods/"
            cp config/config.json "dist/build/${target}/config/config.json"
          done

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGE="dist/release-stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/windows/SteamNavigator" "${STAGE}/linux/SteamNavigator"
          cp -a dist/build/windows/. "${STAGE}/windows/SteamNavigator/"
          cp -a dist/build/linux/. "${STAGE}/linux/SteamNavigator/"
          (cd "${STAGE}/windows" && zip -q -r "../../release/SteamNavigator-${TAG}-windows.zip" "SteamNavigator")
          (cd "${STAGE}/linux" && zip -q -r "../../release/SteamNavigator-${TAG}-linux.zip" "SteamNavigator")
          # The subshells above return to the repo root, not to dist/: keep the
          # checksum inputs and the sums file under dist/release.
          sha256sum dist/release/*.zip dist/mods/*.snavmod.zip > dist/release/SHA256SUMS.txt
          ls -lh dist/release dist/mods

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamNavigator-${{ github.ref_name }}
          path: |
            dist/release/*
            dist/mods/*.snavmod.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Steam Navigator ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-dev.') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
            dist/mods/*.snavmod.zip

      # GitHub suppresses new workflow runs for events created with GITHUB_TOKEN, so
      # the separate "Website Release Data Sync" workflow never fires for releases
      # published here. Sync the generated website version data in this job instead
      # (idempotent; the standalone workflow still covers releases published by a
      # human in the GitHub UI and manual workflow_dispatch runs).
      - name: Sync website release data
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -f -B website-release-data "origin/${DEFAULT_BRANCH}"
          node website/tools/build-release-data.mjs --strict
          if git diff --quiet -- website/assets/data/release-data.js; then
            echo "website release data already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets/data/release-data.js
          git commit -m "chore(website): sync latest release data [skip ci]"
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            echo "::warning::could not push website release data to ${DEFAULT_BRANCH}; run Website Release Data Sync manually"
          fi
